<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>QRShield — Offline</title>
<style>
  :root{
    --black-0:#030303; --black-1:#0a0a0c; --hairline:rgba(255,255,255,0.08);
    --red-000:#ff5470; --red-200:#d81733;
    --text-hi:#f3f2f4; --text-mid:#a9a9b2;
  }
  @media (prefers-color-scheme: light){
    :root{ --black-0:#f6f4f5; --black-1:#ffffff; --hairline:rgba(20,16,18,0.09); --text-hi:#18161a; --text-mid:#5c5862; }
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    display:flex; align-items:center; justify-content:center; text-align:center;
    font-family:-apple-system,"Segoe UI",system-ui,Roboto,Arial,sans-serif;
    color:var(--text-hi);
    background: linear-gradient(180deg, var(--black-1) 0%, var(--black-0) 100%);
    padding: 32px;
  }
  .card{ max-width:340px; }
  .icon{
    width:64px; height:64px; margin:0 auto 18px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background: radial-gradient(closest-side, rgba(255,45,77,0.16), rgba(255,45,77,0) 75%);
    color: var(--red-000);
  }
  h1{ font-size:19px; margin:0 0 8px; }
  p{ font-size:14px; line-height:1.5; color:var(--text-mid); margin:0 0 20px; }
  button{
    appearance:none; border:none; cursor:pointer; border-radius:100px;
    padding:12px 22px; font-size:14.5px; font-weight:600; color:#fff;
    background: linear-gradient(135deg, var(--red-000), var(--red-200));
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" width="30" height="30"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
    </div>
    <h1>You're offline</h1>
    <p>QRShield can't reach the network right now, and this page wasn't saved for offline use yet. Reconnect and reload to keep scanning.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
